[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:backend]
command=uvicorn backend.main:app --host 0.0.0.0 --port %(ENV_PORT)s
directory=/app
autostart=true
autorestart=true
stderr_logfile=/tmp/backend.err.log
stdout_logfile=/tmp/backend.out.log
environment=PYTHONUNBUFFERED="1"

[program:frontend]
command=chainlit run frontend/app.py --host 0.0.0.0 --port 8001
directory=/app
autostart=true
autorestart=true
stderr_logfile=/tmp/frontend.err.log
stdout_logfile=/tmp/frontend.out.log
environment=PYTHONUNBUFFERED="1"
